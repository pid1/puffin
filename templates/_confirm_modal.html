<!--
  The app's shared confirmation dialog, driven by showConfirm().  Callers pass
  the labels they need; an omitted button hides itself, so the same markup
  serves both the two-step child flows and a plain confirm/cancel prompt.

  Its backdrop is marked static so a stray click cannot dismiss a half-finished
  migration — every exit runs through the buttons, which clean up after
  themselves.

  Included by both pages: the first-profile migration offer and child deletion
  are driven from /settings, while the bulk re-assign and the feeding edit
  modals are driven from the dashboard.
-->
<div id="confirm-modal" class="modal hidden">
  <div class="modal-backdrop modal-backdrop-static"></div>
  <div class="modal-content">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <p id="confirm-note" class="hint hidden"></p>
    <div class="form-actions">
      <button
        type="button"
        id="confirm-primary"
        class="btn btn-primary btn-lg"
      ></button>
      <button
        type="button"
        id="confirm-secondary"
        class="btn btn-secondary"
      ></button>
      <button
        type="button"
        id="confirm-cancel"
        class="btn btn-secondary"
      ></button>
    </div>
  </div>
</div>
