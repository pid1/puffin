[project]
name = "puffin"
version = "0.1.0"
description = "Puffin - Baby care activity tracking dashboard"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.148.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.5",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "python-multipart>=0.0.32",
    "jinja2>=3.1.6",
    "fpdf2>=2.8.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx2>=2.14.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ruff is the only linter and formatter this project runs -- see the `lint`
# and `format` scripts in devenv.nix. No CI job enforces formatting; the one
# workflow, container.yml, only builds the image.
#
# Keep this in mind before adding a second formatter: ruff reads line-length
# from here, but black does not and would wrap at its default 88, so the two
# would disagree on every line between 88 and 100 characters.
[tool.uv]
# sadr: install only releases that have been public for at least 7 days
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
# sadr: already merged inside the cooldown
fastapi = "2026-10-19T12:27:00Z"
# sadr: already merged inside the cooldown
httpcore2 = "2026-10-18T16:30:00Z"
# sadr: already merged inside the cooldown
httpx2 = "2026-10-18T16:30:00Z"
# sadr: already merged inside the cooldown
starlette = "2026-10-18T15:51:00Z"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
