[project]
name = "puffin"
version = "0.1.0"
description = "Puffin - Baby care activity tracking dashboard"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "jinja2>=3.1.6",
    "fpdf2>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "httpx2>=2.16.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ruff is the only linter and formatter this project runs -- see the `lint`
# and `format` scripts in devenv.nix. No CI job enforces formatting; the one
# workflow, container.yml, only builds the image.
#
# Keep this in mind before adding a second formatter: ruff reads line-length
# from here, but black does not and would wrap at its default 88, so the two
# would disagree on every line between 88 and 100 characters.
[tool.uv]
# sadr: install only releases that have been public for at least 7 days
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
